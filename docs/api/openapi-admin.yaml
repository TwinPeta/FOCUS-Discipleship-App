openapi: 3.1.0
info:
  title: FCU Back Office – Staff API
  version: 1.0.0
  summary: The staff API used by the FCU back office web app.
  description: |
    Staff (back-office) API, mounted under `/v1/admin`. The mobile API is documented in `openapi.yaml`.

    **Using it with the back office:** set `API_BASE_URL=http://<host>/v1/admin`; the Next.js proxy then forwards
    `/api/proxy/<path>` to `<API_BASE_URL>/<path>`, passing the `fcu_access` cookie through and relaying the API's `Set-Cookie`.

    **Sessions are owned by the API.** `POST /auth/login` creates a server-side session and sets one httpOnly cookie,
    `fcu_access`, holding an opaque random handle (not a token with claims). On every request the API looks the session up,
    so it can end it at once: logout, "sign out" of another device, password change (other devices), password reset and
    suspension (all devices). The idle timeout slides with activity (8 h; 7 days with `rememberMe`; `STAFF_SESSION_*` settings)
    and a session never lives longer than 30 days. A remembered cookie is re-issued as it slides. Clients may send the same
    value as `Authorization: Bearer <value>` instead of the cookie. Mobile-app tokens are rejected.

    **Roles:** `SYSTEM_ADMIN` (everything), `CONTENT_ADMIN` (content, pathways, badges, announcements, stories, notifications),
    `SUPER_MENTOR` (own community only: join requests, members, first-level moderation). Out-of-scope resources return 404, wrong role returns 403.

    **Errors:** RFC 7807 problem+json with a stable `code`; validation errors are 422 with an `errors[]` list.
    Lists return `{ items, total }` (plus `counts` where tabs need them).

    **Rate limits:** `POST /auth/login` 20 per 15 minutes per email; `POST /auth/forgot-password` 10 per hour. Over the limit: `429` with `Retry-After`.

    **Auditing:** every state-changing action by staff is written to the audit log (`GET /audit-log`), with who, what and when.

    **Versioning:** backwards-compatible changes only within `/v1`; a breaking change ships as a new version.
  contact:
    name: FOCUS Uganda – FCU app team
    url: https://focusuganda.org
  license:
    name: Proprietary – FOCUS Uganda
    identifier: LicenseRef-Proprietary
servers:
  - url: https://apis.focusuganda.org/v1/admin
    description: Production
  - url: http://localhost:4000/v1/admin
    description: Local development
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Auth
    description: "Staff sign-in, session cookies, password reset"
  - name: Dashboard
    description: "Headline numbers for the home screen"
  - name: Members
    description: "Students and staff: create, import, roles, suspend, remind"
  - name: Institutions
    description: "Universities and high schools shown at sign-up"
  - name: Communities
    description: "General and specific communities, leaders, closing"
  - name: Join requests
    description: "Approve or decline requests to join a community"
  - name: Roles
    description: "Staff accounts and their roles"
  - name: Content
    description: "Library content (videos, devotionals, quizzes, documents) and its review workflow"
  - name: Pathways
    description: "Discipleship pathways and their steps"
  - name: Badges
    description: "Badges and the rules that award them"
  - name: Announcements
    description: "Messages to everyone or to one community"
  - name: Stories
    description: "Landing page student stories"
  - name: Notifications
    description: "Notification rules"
  - name: Settings
    description: "Platform settings"
  - name: Moderation
    description: "Reports, flagged posts, testimony review and sanctions"
  - name: Privacy
    description: "Data export and deletion requests, guardian consents"
  - name: Audit
    description: "The log of what staff did, and its export"
  - name: Reports
    description: "Scheduled and on-demand reports"
  - name: My community
    description: "What a super-mentor sees and does for their own community"
  - name: Account
    description: "The signed-in staff member: profile, password, sessions"
  - name: Media
    description: "File uploads for covers, thumbnails, videos, documents and story videos"
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: postAuthLogin
      summary: "Staff login (creates a server-side session, sets the httpOnly fcu_access cookie)"
      description: "Roles: public"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: postAuthLogout
      summary: "Sign out (ends the session on the server and clears the cookie)"
      description: "Roles: public"
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: postAuthForgotpassword
      summary: "Request a reset link (always 200)"
      description: "Roles: public"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: postAuthResetpassword
      summary: "Set a new password from a reset token (410 if expired/used)"
      description: "Roles: public"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getAuthMe
      summary: "Current staff user"
      description: "Roles: any staff"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: "KPIs, weekly activity, attention items, inactive members"
      description: "Roles: SYSTEM_ADMIN, CONTENT_ADMIN, SUPER_MENTOR (scoped)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /members:
    get:
      tags: [Members]
      operationId: getMembers
      summary: "List members (q, role, status, communityId, institutionId)"
      description: "Roles: SYSTEM_ADMIN, SUPER_MENTOR (scoped)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Members]
      operationId: postMembers
      summary: "Create a member; minors get a pending guardian-consent record"
      description: "Roles: SYSTEM_ADMIN"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMember' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /members/inactive:
    get:
      tags: [Members]
      operationId: getMembersInactive
      summary: "Members inactive beyond 30 days"
      description: "Roles: SYSTEM_ADMIN, SUPER_MENTOR (scoped)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /members/import:
    post:
      tags: [Members]
      operationId: postMembersImport
      summary: "Bulk import rows; returns created/skipped/failed per row"
      description: "Roles: SYSTEM_ADMIN"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /members/{id}:
    get:
      tags: [Members]
      operationId: getMembersId
      summary: "Member detail"
      description: "Roles: SYSTEM_ADMIN, SUPER_MENTOR (scoped)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /members/{id}/role:
    patch:
      tags: [Members]
      operationId: patchMembersIdRole
      summary: "Change role (audited, not your own)"
      description: "Roles: SYSTEM_ADMIN"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /members/{id}/community:
    patch:
      tags: [Members]
      operationId: patchMembersIdCommunity
      summary: "Move to another specific community of the same institution"
      description: "Roles: SYSTEM_ADMIN"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityIdBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /members/{id}/suspend:
    post:
      tags: [Members]
      operationId: postMembersIdSuspend
      summary: "Suspend (reason \u22655 chars); revokes sessions, records a sanction"
      description: "Roles: SYSTEM_ADMIN"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /members/{id}/remind:
    post:
      tags: [Members]
      operationId: postMembersIdRemind
      summary: "Send a check-in reminder"
      description: "Roles: SYSTEM_ADMIN, SUPER_MENTOR (scoped)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /institutions:
    get:
      tags: [Institutions]
      operationId: getInstitutions
      summary: "List institutions with counts"
      description: "Roles: staff"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstitutionList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Institutions]
      operationId: postInstitutions
      summary: "Create institution (auto-creates its General community)"
      description: "Roles: SYSTEM_ADMIN"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstitutionBody' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Institution' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /institutions/{id}:
    patch:
      tags: [Institutions]
      operationId: patchInstitutionsId
      summary: "Update institution"
      description: "Roles: SYSTEM_ADMIN"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstitutionBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Institution' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /communities:
    get:
      tags: [Communities]
      operationId: getCommunities
      summary: "List communities (super-mentors see only their own)"
      description: "Roles: staff"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Communities]
      operationId: postCommunities
      summary: "Create community; superMentorId assigns the leader"
      description: "Roles: SYSTEM_ADMIN"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityBody' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Community' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /communities/{id}:
    get:
      tags: [Communities]
      operationId: getCommunitiesId
      summary: "Community detail"
      description: "Roles: staff (scoped)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Communities]
      operationId: patchCommunitiesId
      summary: "Update community (super-mentors: details/meeting only)"
      description: "Roles: SYSTEM_ADMIN, SUPER_MENTOR (own)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /join-requests:
    get:
      tags: [Join requests]
      operationId: getJoinrequests
      summary: "List requests with conflict info and pending count"
      description: "Roles: SYSTEM_ADMIN, SUPER_MENTOR (scoped), CONTENT_ADMIN"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRequestList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /join-requests/bulk-approve:
    post:
      tags: [Join requests]
      operationId: postJoinrequestsBulkapprove
      summary: "Approve many; conflicts are skipped with a reason"
      description: "Roles: SYSTEM_ADMIN, SUPER_MENTOR"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdsBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /join-requests/{id}/approve:
    post:
      tags: [Join requests]
      operationId: postJoinrequestsIdApprove
      summary: "Approve (409 community_limit_reached if already in another specific community)"
      description: "Roles: SYSTEM_ADMIN, SUPER_MENTOR"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /join-requests/{id}/decline:
    post:
      tags: [Join requests]
      operationId: postJoinrequestsIdDecline
      summary: "Decline with optional reason"
      description: "Roles: SYSTEM_ADMIN, SUPER_MENTOR"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptReasonBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /roles/staff:
    post:
      tags: [Roles]
      operationId: postRolesStaff
      summary: "Create a staff account (super-mentor needs communityId)"
      description: "Roles: SYSTEM_ADMIN"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffBody' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /content:
    get:
      tags: [Content]
      operationId: getContent
      summary: "Library list. With ?status= returns a bare array of picker options"
      description: "Roles: SYSTEM_ADMIN, CONTENT_ADMIN, SUPER_MENTOR (published only)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { oneOf: [{ $ref: '#/components/schemas/ContentItemList' }, { type: array, items: { $ref: '#/components/schemas/ContentItem' } }] }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Content]
      operationId: postContent
      summary: "Create draft (submitForReview:true to submit)"
      description: "Roles: SYSTEM_ADMIN, CONTENT_ADMIN"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentBody' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /content/{id}:
    get:
      tags: [Content]
      operationId: getContentId
      summary: "Content detail with approval trail"
      description: "Roles: SYSTEM_ADMIN, CONTENT_ADMIN"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItemDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Content]
      operationId: patchContentId
      summary: "Edit a draft"
      description: "Roles: SYSTEM_ADMIN, CONTENT_ADMIN"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItemDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /content/{id}/transition:
    post:
      tags: [Content]
      operationId: postContentIdTransition
      summary: "Workflow: SUBMIT_FOR_REVIEW, APPROVE_AND_PUBLISH, REQUEST_CHANGES, ARCHIVE, RESTORE_TO_DRAFT. Authors cannot validate their own content (except SYSTEM_ADMIN)"
      description: "Roles: SYSTEM_ADMIN, CONTENT_ADMIN"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /bible-links:
    get:
      tags: [Content]
      operationId: getBiblelinks
      summary: "Bible character/text options (?q=)"
      description: "Roles: staff"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BibleLinkList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /pathways:
