        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /my-community/moderation/{id}:
    post:
      tags: [My community]
      operationId: postMycommunityModerationId
      summary: "First-level decision: dismiss | escalate"
      description: "Roles: SUPER_MENTOR"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
