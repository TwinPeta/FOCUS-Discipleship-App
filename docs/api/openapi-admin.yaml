        name: { type: string }
        theme: { type: string }
        level: { type: string }
        description: { type: string }
        steps: { type: array, items: { type: object, properties: { id: { type: string }, contentId: { type: string }, title: { type: string }, contentType: { type: string }, order: { type: integer }, required: { type: boolean } }, required: [id, contentId, title, contentType, order, required] } }
        unlockRule: { type: string }
        badgeAwardedId: {}
        badgeName: {}
        learnersCount: { type: integer }
        published: { type: boolean }
        updatedAt: { type: string, format: date-time }
      required: [id, name, theme, level, description, steps, unlockRule, badgeAwardedId, badgeName, learnersCount, published, updatedAt]
    PathwayDetail:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        theme: { type: string }
        level: { type: string }
        description: { type: string }
        steps: { type: array, items: { type: object, properties: { id: { type: string }, contentId: { type: string }, title: { type: string }, contentType: { type: string }, order: { type: integer }, required: { type: boolean } }, required: [id, contentId, title, contentType, order, required] } }
        unlockRule: { type: string }
        badgeAwardedId: {}
        badgeName: {}
        learnersCount: { type: integer }
        published: { type: boolean }
        updatedAt: { type: string, format: date-time }
      required: [id, name, theme, level, description, steps, unlockRule, badgeAwardedId, badgeName, learnersCount, published, updatedAt]
    Badge:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        ruleType: { type: string }
        ruleTargetCount: { type: integer }
        ruleDescription: { type: string }
        icon: { type: string }
        earnedCount: { type: integer }
        visibleOnProfile: { type: boolean }
        status: { type: string }
        updatedAt: { type: string, format: date-time }
      required: [id, name, description, ruleType, ruleTargetCount, ruleDescription, icon, earnedCount, visibleOnProfile, status, updatedAt]
    Announcement:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        message: { type: string }
        audienceType: { type: string }
        communityId: {}
        communityName: { type: string }
        imageUrl: {}
        scheduledFor: { type: [string, "null"], format: date-time }
        status: { type: string }
        authorName: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, title, message, audienceType, communityId, communityName, imageUrl, scheduledFor, status, authorName, createdAt]
    Story:
      type: object
      properties:
        id: { type: string }
        studentName: { type: string }
        institution: { type: string }
        videoUrl: { type: string }
        duration: { type: string }
        visible: { type: boolean }
        order: { type: integer }
        consentObtained: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, studentName, institution, videoUrl, duration, visible, order, consentObtained, createdAt]
    NotificationRule:
      type: object
      properties:
        id: { type: string }
        triggerKey: { type: string }
        triggerLabel: { type: string }
        recipient: { type: string }
        channels: { type: object, properties: { inApp: { type: boolean }, email: { type: boolean }, sms: { type: boolean } }, required: [inApp, email, sms] }
        enabled: { type: boolean }
        template: { type: object, properties: { title: { type: string }, message: { type: string } }, required: [title, message] }
        updatedAt: { type: string, format: date-time }
      required: [id, triggerKey, triggerLabel, recipient, channels, enabled, template, updatedAt]
    ModerationReport:
      type: object
      properties:
        id: { type: string }
        reason: { type: string }
        reporterName: { type: string }
        reportedUserId: { type: string }
        reportedUserName: { type: string }
        reportedUserRole: { type: string }
        communityId: { type: string }
        communityName: { type: string }
        details: { type: string }
        screenshotUrl: {}
        earlierReportsCount: { type: integer }
        status: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id]
    ModerationTestimony:
      type: object
      properties:
        id: { type: string }
        authorName: { type: string }
        communityId: { type: string }
        communityName: { type: string }
        story: { type: string }
        videoUrl: {}
        studentAgreement: { type: boolean }
        notes: {}
        status: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, authorName, communityId, communityName, story, videoUrl, studentAgreement, notes, status, createdAt]
    ModerationPost:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        authorName: { type: string }
        communityId: { type: string }
        communityName: { type: string }
        content: { type: string }
        reportCount: { type: integer }
        hidden: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, kind, authorName, communityId, communityName, content, reportCount, hidden, createdAt]
    Sanction:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        userName: { type: string }
        communityId: { type: string }
        communityName: { type: string }
        type: { type: string }
        reason: { type: string }
        issuedBy: { type: string }
        issuedAt: { type: string, format: date-time }
        active: { type: boolean }
      required: [id]
    GuardianConsent:
      type: object
      properties:
        id: { type: string }
        studentName: { type: string }
        guardianName: { type: string }
        guardianContact: { type: string }
        status: { type: string }
        updatedAt: { type: string, format: date-time }
      required: [id]
    DataRequest:
      type: object
      properties:
        id: { type: string }
        memberName: { type: string }
        memberEmail: { type: string }
        type: { type: string }
        requestedAt: { type: string, format: date-time }
        deadlineAt: { type: string, format: date-time }
        status: { type: string }
      required: [id]
    AuditEntry:
      type: object
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        actorName: { type: string }
        actorRole: { type: string }
        action: { type: string }
        actionLabel: { type: string }
        target: { type: string }
        place: { type: string }
      required: [id]
    ReportSchedule:
      type: object
      properties:
        id: { type: string }
        reportType: { type: string }
        reportLabel: { type: string }
        cadence: { type: string }
        recipientEmail: { type: string }
        active: { type: boolean }
      required: [id, reportType, reportLabel, cadence, recipientEmail, active]
    Dashboard:
      type: object
      properties:
        kpis: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string }, value: { type: string }, changePercent: { type: integer } }, required: [id, label, value, changePercent] } }
        weeklyActivity: { type: array, items: { type: object, properties: { day: { type: string }, logins: { type: integer }, completions: { type: integer } }, required: [day, logins, completions] } }
        needsAttention: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string }, count: { type: integer }, href: { type: string } }, required: [id] } }
        inactiveMembers: { type: array, items: {} }
    ReportsCatalog:
      type: object
      properties:
        membersOverTime: { type: array, items: { type: object, properties: { period: { type: string }, totalMembers: { type: integer }, activeMembers: { type: integer } }, required: [period, totalMembers, activeMembers] } }
        completionsByType: { type: array, items: {} }
        activeCommunities: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, campus: { type: string }, memberCount: { type: integer }, activePercent: { type: integer } }, required: [id, name, campus, memberCount, activePercent] } }
        scheduledReports: { type: array, items: {} }
    MediaSlotBody:
      type: object
      properties:
        purpose: { type: string, enum: [cover_photo, content_thumbnail, content_video, content_document, story_video] }
        content_type: { type: string }
        size_bytes: { type: integer, minimum: 1 }
      required: [purpose, content_type, size_bytes]
    MediaSlot:
      type: object
      properties:
        media_id: { type: string }
        url: { type: string, description: "Permanent address of the file once uploaded" }
        direct: { type: boolean, description: "true: PUT to upload_url; false: PUT the bytes to /media/{id}/upload" }
        upload_url: { type: [string, 'null'] }
        upload_headers: { type: object, additionalProperties: { type: string } }
        expires_at: { type: string, format: date-time }
      required: [media_id, url, direct, upload_url, upload_headers, expires_at]
    MediaReady:
      type: object
      properties:
        media_id: { type: string }
        status: { type: string }
        url: { type: string }
      required: [media_id, status, url]
    SessionList:
      type: object
      properties:
        sessions: { type: array, items: { type: object, properties: { id: { type: string }, deviceName: { type: string }, browser: { type: string }, os: { type: string }, ipAddress: { type: string }, lastActiveAt: { type: string, format: date-time }, current: { type: boolean } }, required: [id, deviceName, browser, os, ipAddress, lastActiveAt, current] } }
      required: [sessions]
    MyCommunity:
      type: object
      properties:
        communityId: { type: string }
        communityName: { type: string }
        campus: { type: string }
        kpis: { type: object, properties: { members: { type: integer }, pendingRequests: { type: integer }, reportsToReview: { type: integer }, inactiveMembers: { type: integer } } }
        pendingRequests: { type: array, items: {} }
