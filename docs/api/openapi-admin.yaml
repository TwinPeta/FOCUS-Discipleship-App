          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /account/profile:
    patch:
      tags: [Account]
      operationId: patchAccountProfile
      summary: "Update own name/avatar"
      description: "Roles: staff"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /account/password:
    post:
      tags: [Account]
      operationId: postAccountPassword
      summary: "Change password (revokes refresh tokens)"
      description: "Roles: staff"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /account/sessions:
    get:
      tags: [Account]
      operationId: getAccountSessions
      summary: "Own active sessions"
      description: "Roles: staff"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Object' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /account/sessions/{id}:
    delete:
      tags: [Account]
      operationId: deleteAccountSessionsId
      summary: "Revoke a session"
      description: "Roles: staff"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: fcu_access }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: RFC 7807 problem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, examples: [validation_failed, forbidden, not_found, ACCOUNT_SUSPENDED] }
        detail: { type: string }
        errors: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string } } } }
    Ok: { type: object, properties: { ok: { type: boolean } } }
    Object: { type: object, additionalProperties: true }
    List: { type: object, properties: { items: { type: array, items: { type: object, additionalProperties: true } }, total: { type: integer }, counts: { type: object, additionalProperties: { type: integer } } } }
    Role: { type: string, enum: [STUDENT, MENTOR, SUPER_MENTOR, ALUMNI, CONTENT_ADMIN, SYSTEM_ADMIN] }
    SessionUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [INVITED, ACTIVE, INACTIVE, SUSPENDED] }
        communityId: { type: [string, 'null'] }
        communityIds: { type: array, items: { type: string } }
        communityName: { type: [string, 'null'] }
    SessionResponse: { type: object, properties: { user: { $ref: '#/components/schemas/SessionUser' } } }
    LoginBody: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string }, rememberMe: { type: boolean } } }
    EmailBody: { type: object, required: [email], properties: { email: { type: string, format: email } } }
    ResetBody: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, description: '≥8 chars, letter + number' } } }
    Member:
      type: object
      properties:
        id: { type: string }
        fullName: { type: string }
        username: { type: string }
        email: { type: string }
        phone: { type: [string, 'null'] }
        birthdate: { type: [string, 'null'] }
        isMinor: { type: boolean }
        guardianConsentStatus: { type: [string, 'null'], enum: [PENDING, RECEIVED, null] }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [INVITED, ACTIVE, INACTIVE, SUSPENDED] }
        institutionId: { type: string }
        institutionName: { type: string }
        communityId: { type: [string, 'null'] }
        communityName: { type: [string, 'null'] }
        lastActiveAt: { type: string, format: date-time }
        participation: { type: object, properties: { resourcesCompleted: { type: integer }, meetingsAttended: { type: integer }, badgesEarned: { type: integer } } }
    MemberList: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Member' } }, total: { type: integer } } }
    AddMember:
      type: object
      required: [fullName, email, institutionId]
      properties:
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        birthdate: { type: string, format: date }
        role: { $ref: '#/components/schemas/Role' }
        institutionId: { type: string }
        communityId: { type: string }
        guardianConsentReceived: { type: boolean }
        sendInvitation: { type: boolean }
    ImportBody: { type: object, required: [rows], properties: { rows: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/AddMember' } } } }
    ImportResult: { type: object, properties: { createdCount: { type: integer }, skippedCount: { type: integer }, failedRows: { type: array, items: { type: object, properties: { rowNumber: { type: integer }, error: { type: string } } } } } }
    RoleBody: { type: object, required: [role], properties: { role: { $ref: '#/components/schemas/Role' } } }
    CommunityIdBody: { type: object, required: [communityId], properties: { communityId: { type: string } } }
    ReasonBody: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3 } } }
    OptReasonBody: { type: object, properties: { reason: { type: string } } }
    IdsBody: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string } } } }
    BulkResult: { type: object, properties: { approved: { type: array, items: { type: string } }, skipped: { type: array, items: { type: object, properties: { id: { type: string }, reason: { type: string } } } } } }
    InstitutionBody: { type: object, required: [name, type, city], properties: { name: { type: string }, type: { type: string, enum: [UNIVERSITY, HIGH_SCHOOL] }, country: { type: string, enum: [Uganda, Kenya, Rwanda] }, city: { type: string }, generalCoverUrl: { type: string }, shownInSignup: { type: boolean } } }
    CommunityBody:
      type: object
      required: [institutionId, name]
      properties:
        institutionId: { type: string }
        kind: { type: string, enum: [GENERAL, SPECIFIC] }
        name: { type: string }
        description: { type: string }
        coverPhotoUrl: { type: string }
        meetingDay: { type: string, examples: [Tuesday] }
        meetingTime: { type: string, examples: ['17:00'] }
        meetingPlace: { type: string }
        superMentorId: { type: string }
        mentorIds: { type: array, items: { type: string } }
        openForJoinRequests: { type: boolean }
        status: { type: string, enum: [ACTIVE, CLOSED] }
    StaffBody: { type: object, required: [fullName, email, role], properties: { fullName: { type: string }, email: { type: string }, role: { type: string, enum: [SYSTEM_ADMIN, CONTENT_ADMIN, SUPER_MENTOR] }, communityId: { type: string }, sendInviteEmail: { type: boolean } } }
    ContentBody:
      type: object
      required: [title, type, bibleLink]
      properties:
        title: { type: string }
        type: { type: string, enum: [VIDEO, DEVOTIONAL, QUIZ, DOCUMENT] }
        bibleLink: { type: string, description: id from /bible-links }
        language: { type: string }
        tags: { type: array, items: { type: string } }
        description: { type: string }
        validatorName: { type: string }
        pathwayIds: { type: array, items: { type: string } }
        body: { type: string }
        videoUrl: { type: string }
        thumbnailUrl: { type: string }
        documentUrl: { type: string }
        submitForReview: { type: boolean }
    TransitionBody: { type: object, required: [action], properties: { action: { type: string, enum: [SUBMIT_FOR_REVIEW, APPROVE_AND_PUBLISH, REQUEST_CHANGES, ARCHIVE, RESTORE_TO_DRAFT] }, notes: { type: string } } }
    PathwayBody:
      type: object
      required: [name, theme, steps]
      properties:
        name: { type: string }
        theme: { type: string }
        level: { type: string, enum: [Beginner, Intermediate, Advanced] }
        description: { type: string }
        unlockRule: { type: string, enum: [none, previous_pathway, profile_complete, mentor_assigned] }
        badgeAwardedId: { type: [string, 'null'] }
        published: { type: boolean }
        steps: { type: array, minItems: 1, items: { type: object, required: [contentId, title, contentType], properties: { id: { type: string }, contentId: { type: string }, title: { type: string }, contentType: { type: string, enum: [video, devotional, document, quiz] }, required: { type: boolean } } } }
    BadgeBody: { type: object, required: [name, description, ruleType, ruleTargetCount], properties: { name: { type: string }, description: { type: string }, ruleType: { type: string, enum: [join_community, finish_quizzes, pray_requests, complete_pathway, attend_meetings_streak] }, ruleTargetCount: { type: integer, minimum: 1, maximum: 1000 }, icon: { type: string }, visibleOnProfile: { type: boolean }, status: { type: string, enum: [active, draft, archived] } } }
    AnnouncementBody: { type: object, required: [title, message, audienceType], properties: { title: { type: string }, message: { type: string }, audienceType: { type: string, enum: [all, community] }, communityId: { type: string }, imageUrl: { type: string }, publishTiming: { type: string, enum: [now, scheduled] }, scheduledFor: { type: string, format: date-time } } }
    StoryBody: { type: object, required: [studentName, institution, videoUrl, duration, consentObtained], properties: { studentName: { type: string }, institution: { type: string }, videoUrl: { type: string }, duration: { type: string, examples: ['1:45'] }, consentObtained: { type: boolean, const: true } } }
    ReorderBody: { type: object, required: [stories], properties: { stories: { type: array, items: { type: object, properties: { id: { type: string }, order: { type: integer } } } } } }
    ActionBody: { type: object, required: [action, notes], properties: { action: { type: string, description: 'Reports: DISMISS|WARN|HIDE|ESCALATE|SUSPEND|DELETE. Posts: KEEP|HIDE|WARN_AUTHOR|ESCALATE' }, notes: { type: string, minLength: 3 } } }
    TestimonyReviewBody: { type: object, required: [action], properties: { action: { type: string, enum: [APPROVE, REQUEST_CHANGES, REJECT] }, notes: { type: string } } }
    ScheduleBody: { type: object, required: [reportType, cadence, recipientEmail], properties: { reportType: { type: string, enum: [discipleship_summary, community_health, content_completions] }, cadence: { type: string, enum: [weekly, monthly, quarterly] }, recipientEmail: { type: string, format: email } } }

