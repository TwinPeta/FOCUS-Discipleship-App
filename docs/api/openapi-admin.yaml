          content:
            application/json:
              schema: { $ref: '#/components/schemas/PathwayList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Pathways]
      operationId: postPathways
      summary: "Create pathway; publishing requires every step's content to be PUBLISHED"
      description: "Roles: SYSTEM_ADMIN, CONTENT_ADMIN"
      requestBody:
        required: true
        content:
