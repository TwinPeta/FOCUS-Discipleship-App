  /account/profile:
    patch:
      tags: [Account]
      operationId: patchAccountProfile
      summary: "Update own name/avatar"
      description: "Roles: staff"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /account/password:
    post:
      tags: [Account]
      operationId: postAccountPassword
      summary: "Change password (signs out every other device)"
      description: "Roles: staff"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /media:
    post:
      tags: [Media]
      operationId: postMedia
      summary: "Start an upload (returns where to send the file and its permanent address)"
      description: |
        Roles: staff. Allowed per `purpose`: `cover_photo` (jpeg/png, 5 MB), `content_thumbnail` (jpeg/png/webp, 5 MB),
        `content_video` (mp4/webm/quicktime, 500 MB), `content_document` (pdf/doc/docx, 25 MB), `story_video` (mp4/webm/quicktime, 200 MB).

        With Cloudflare R2 (`direct: true`) the browser `PUT`s the file to `upload_url` with `upload_headers`; otherwise it sends
        the bytes to `PUT /media/{id}/upload`. Then call `POST /media/{id}/complete` and store the returned `url` on the record.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaSlotBody' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaSlot' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /media/{id}/upload:
    put:
      tags: [Media]
      operationId: putMediaIdUpload
      summary: "Send the file bytes (local-storage mode only; with R2 upload to the signed URL instead)"
      description: "Roles: staff (the uploader). Body is the raw file; `Content-Type` must match the slot."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          '*/*':
            schema: { type: string, format: binary }
      responses:
        '204': { description: Stored }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
  /media/{id}/complete:
    post:
      tags: [Media]
      operationId: postMediaIdComplete
      summary: "Confirm the upload arrived; returns the permanent file address"
      description: "Roles: staff (the uploader)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaReady' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /account/sessions:
    get:
      tags: [Account]
      operationId: getAccountSessions
      summary: "Own active sessions (server-side; `current` marks this device)"
      description: "Roles: staff"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /account/sessions/{id}:
    delete:
      tags: [Account]
      operationId: deleteAccountSessionsId
      summary: "Revoke a session (that device is signed out on its next request)"
      description: "Roles: staff"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: fcu_access }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: RFC 7807 problem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Institution:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        country: { type: string }
        city: { type: string }
        generalCoverUrl: { type: string }
        shownInSignup: { type: boolean }
        communityCount: { type: integer }
        studentCount: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, name, type, country, city, generalCoverUrl, shownInSignup, communityCount, studentCount, createdAt]
    Community:
      type: object
      properties:
        id: { type: string }
        institutionId: { type: string }
        institutionName: { type: string }
        kind: { type: string }
        name: { type: string }
        description: { type: string }
        coverPhotoUrl: { type: string }
        meetingDay: { type: string }
        meetingTime: { type: string }
        meetingPlace: { type: string }
        superMentorId: { type: string }
        superMentorName: { type: [string, "null"] }
        mentorIds: { type: array, items: { type: string } }
        openForJoinRequests: { type: boolean }
        status: { type: string }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, institutionId, institutionName, kind, name, description, coverPhotoUrl, meetingDay, meetingTime, meetingPlace, superMentorId, superMentorName, mentorIds, openForJoinRequests, status, memberCount, createdAt]
    CommunityDetail:
      type: object
      properties:
        id: { type: string }
        institutionId: { type: string }
        institutionName: { type: string }
        kind: { type: string }
        name: { type: string }
        description: { type: string }
        coverPhotoUrl: { type: string }
        meetingDay: { type: string }
        meetingTime: { type: string }
        meetingPlace: { type: string }
        superMentorId: { type: string }
        superMentorName: { type: [string, "null"] }
        mentorIds: { type: array, items: {} }
        openForJoinRequests: { type: boolean }
        status: { type: string }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id]
    JoinRequest:
      type: object
      properties:
        id: { type: string }
        studentId: { type: string }
        studentUsername: { type: string }
        institutionName: { type: string }
        requestedCommunityId: { type: string }
        requestedCommunityName: { type: string }
        requestedAt: { type: string, format: date-time }
        status: { type: string }
        currentSpecificCommunityId: { type: [string, "null"] }
        currentSpecificCommunityName: { type: [string, "null"] }
      required: [id]
    ContentItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        type: { type: string }
        bibleLink: { type: string }
        language: { type: string }
        tags: { type: array, items: {} }
        description: { type: string }
        validatorName: { type: string }
        pathwayIds: { type: array, items: {} }
        body: { type: string }
        videoUrl: { type: string }
        thumbnailUrl: { type: string }
        documentUrl: { type: string }
        status: { type: string }
        authorName: { type: string }
        validatedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
        approvalTrail: { type: array, items: { type: object, properties: { id: { type: string }, action: { type: string }, actorName: { type: string }, notes: {}, createdAt: { type: string, format: date-time } }, required: [id, action, actorName, notes, createdAt] } }
        published: { type: boolean }
      required: [id, title, type]
    ContentItemDetail:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        type: { type: string }
        bibleLink: { type: string }
        language: { type: string }
        tags: { type: array, items: {} }
        description: { type: string }
        validatorName: { type: string }
        pathwayIds: { type: array, items: {} }
        body: { type: string }
        videoUrl: { type: string }
        thumbnailUrl: { type: string }
        documentUrl: { type: string }
        status: { type: string }
        authorName: { type: string }
        validatedAt: {}
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
        approvalTrail: { type: array, items: { type: object, properties: { id: { type: string }, action: { type: string }, actorName: { type: string }, notes: {}, createdAt: { type: string, format: date-time } }, required: [id, action, actorName, notes, createdAt] } }
      required: [id, title, type, bibleLink, language, tags, description, validatorName, pathwayIds, body, videoUrl, thumbnailUrl, documentUrl, status, authorName, validatedAt, updatedAt, version, approvalTrail]
    BibleLink:
