# Builds a debug APK of the FCU mobile app (mobile/) for phone testing.
# Debug, not release: the app runs on fake repositories, and testers need the
# debug scenario screen (long-press "Version" on Settings) to approve join
# requests, go offline, receive warnings, etc.
name: Mobile debug APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Golden images are rendered on Windows; fonts differ on Linux, so the
      # golden suite only runs locally. Everything else must pass.
      - name: Test (all but goldens)
        run: |
          dirs=$(find test -mindepth 1 -maxdepth 1 -type d ! -name golden ! -name support | sort)
          flutter test $dirs test/widget_test.dart

      # Set the repository variable API_BASE_URL (e.g. https://apis.focusuganda.org/v1) to build against the real
      # backend; leave it unset to build the offline demo on fake data.
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fcu-debug-apk-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
