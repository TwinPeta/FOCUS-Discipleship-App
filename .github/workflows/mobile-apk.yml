# Builds a debug APK of the FCU mobile app (mobile/) for phone testing.
# Debug, not release: the app runs on fake repositories, and testers need the
# debug scenario screen (long-press "Version" on Settings) to approve join
# requests, go offline, receive warnings, etc.
name: Mobile debug APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish as the latest GitHub Release (testers are offered it as an update). Off: download the APK from the run only.'
        type: boolean
        default: false

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

# Publishing a GitHub Release (in-app updates) needs write access to contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Golden images are rendered on Windows; fonts differ on Linux, so the
      # golden suite only runs locally. Everything else must pass.
      - name: Test (all but goldens)
        run: |
          dirs=$(find test -mindepth 1 -maxdepth 1 -type d ! -name golden ! -name support | sort)
          flutter test $dirs test/widget_test.dart

      # Phone push is on when the repository variables FCM_PROJECT_ID, FCM_SENDER_ID and the per-platform FCM_API_KEY_*/FCM_APP_ID_*
      # are set (public Firebase identifiers); without them the app has local notifications only.
      # The app always talks to the real API (production by default). Set the repository variable API_BASE_URL
      # (e.g. a staging server) to build against a different one.
      # Fixed signing key (repository secrets) so each new APK installs over
      # the previous one. Without the secrets, the runner's throwaway debug
      # key is used and testers must uninstall before updating.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FCU_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fcu.keystore"
            echo "FCU_KEYSTORE_PATH=$RUNNER_TEMP/fcu.keystore" >> "$GITHUB_ENV"
            echo "Using the fixed FCU signing key."
          else
            echo "::warning::FCU_KEYSTORE_BASE64 is not set; this APK is signed with a throwaway key and will not install over older builds."
          fi

      # The app always talks to the real API (production by default). Set the repository variable API_BASE_URL
      # (e.g. a staging server) to build against a different one. The build number (run number) lets the
      # app detect newer releases.
      - name: Build debug APK
        env:
          FCU_KEYSTORE_PASSWORD: ${{ secrets.FCU_KEYSTORE_PASSWORD }}
          FCU_KEY_ALIAS: ${{ secrets.FCU_KEY_ALIAS }}
          FCU_KEY_PASSWORD: ${{ secrets.FCU_KEY_PASSWORD }}
        run: >-
          flutter build apk --debug
          --build-number=${{ github.run_number }}
          --dart-define=APP_BUILD_NUMBER=${{ github.run_number }}
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://apis.focusuganda.org/v1' }}
          --dart-define=FCM_PROJECT_ID=${{ vars.FCM_PROJECT_ID }}
          --dart-define=FCM_SENDER_ID=${{ vars.FCM_SENDER_ID }}
          --dart-define=FCM_API_KEY_ANDROID=${{ vars.FCM_API_KEY_ANDROID }}
          --dart-define=FCM_APP_ID_ANDROID=${{ vars.FCM_APP_ID_ANDROID }}
          --dart-define=FCM_API_KEY_IOS=${{ vars.FCM_API_KEY_IOS }}
          --dart-define=FCM_APP_ID_IOS=${{ vars.FCM_APP_ID_IOS }}
          --dart-define=FCM_IOS_BUNDLE_ID=${{ vars.FCM_IOS_BUNDLE_ID }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fcu-debug-apk-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      # Public download for testers and the app's "Update available" banner.
      # Tag: android-build-<run number>; asset: fcu.apk.
      - name: Publish GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/fcu.apk"
          gh release create "android-build-${{ github.run_number }}" "$RUNNER_TEMP/fcu.apk"             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --title "FCU Android test build ${{ github.run_number }}"             --notes "Debug build of ${{ github.sha }}. Install fcu.apk on Android; the app also offers updates from here."             --latest
