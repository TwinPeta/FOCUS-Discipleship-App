# Builds the FCU app (mobile/) and, when asked, publishes ONE release per app version with both phones' files:
#   - fcu.apk                       Android (the file the app's "Update available" banner installs)
#   - fcu-<version>-unsigned.ipa    iPhone, unsigned: testers sideload it (AltStore / Sideloadly) until
#                                   TestFlight is set up with an Apple Developer account
#
# Every release is one app VERSION, never a build number:
#   - the version is `version:` in mobile/pubspec.yaml (e.g. 1.0.0-beta.2+1 -> 1.0.0-beta.2);
#   - mobile/docs/release-notes/<version>.md must exist, or the workflow stops before building;
#   - the release is tagged mobile-v<version>, titled "FCU app <version>", and its text is those notes
#     (plus the files' SHA-256);
#   - a version is released once: to release again, raise the version and add its notes.
#
# Pushes to main build and test Android only (the APK is kept as a run artifact; the iOS build is checked by
# "Mobile iOS build check"). To release: Actions > "Mobile build" > Run workflow > tick "Publish".
name: Mobile build

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
      - '.github/scripts/mobile-version.sh'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this version as the latest release, with the Android APK and the iPhone file. Needs a version not released before.'
        type: boolean
        default: false

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

# Publishing a GitHub Release needs write access to contents.
permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.50.0
  # The app always talks to the real API (production by default). Set the repository variable API_BASE_URL
  # (e.g. a staging server) to build against a different one.
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://apis.focusuganda.org/v1' }}
  # Public Firebase identifiers for phone push (repository variables); empty = local notifications only.
  FCM_DEFINES: >-
    --dart-define=FCM_PROJECT_ID=${{ vars.FCM_PROJECT_ID }}
    --dart-define=FCM_SENDER_ID=${{ vars.FCM_SENDER_ID }}
    --dart-define=FCM_API_KEY_ANDROID=${{ vars.FCM_API_KEY_ANDROID }}
    --dart-define=FCM_APP_ID_ANDROID=${{ vars.FCM_APP_ID_ANDROID }}
    --dart-define=FCM_API_KEY_IOS=${{ vars.FCM_API_KEY_IOS }}
    --dart-define=FCM_APP_ID_IOS=${{ vars.FCM_APP_ID_IOS }}
    --dart-define=FCM_IOS_BUNDLE_ID=${{ vars.FCM_IOS_BUNDLE_ID }}
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}

jobs:
  # First, before anything is built: the version, its release notes, and (when publishing) that it is new.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      notes: ${{ steps.v.outputs.notes }}
      version_code: ${{ steps.v.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the Android version code is the commit count
      - name: Version and release notes
        id: v
        run: bash .github/scripts/mobile-version.sh
      - name: Version not released yet
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "${{ steps.v.outputs.tag }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if printf '%s\n' "$assets" | grep -qx 'fcu.apk'; then
            echo "::error::${{ steps.v.outputs.version }} is already released. Raise 'version:' in mobile/pubspec.yaml and add its release notes."
            exit 1
          fi

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Golden images are rendered on Windows; fonts differ on Linux, so the
      # golden suite only runs locally. Everything else must pass.
      - name: Test (all but goldens)
        run: |
          dirs=$(find test -mindepth 1 -maxdepth 1 -type d ! -name golden ! -name support | sort)
          flutter test $dirs test/widget_test.dart

      # Fixed signing key (repository secrets) so each new APK installs over
      # the previous one. Without the secrets, the runner's throwaway debug
      # key is used and testers must uninstall before updating.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FCU_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fcu.keystore"
            echo "FCU_KEYSTORE_PATH=$RUNNER_TEMP/fcu.keystore" >> "$GITHUB_ENV"
            echo "Using the fixed FCU signing key."
          else
            echo "::warning::FCU_KEYSTORE_BASE64 is not set; this APK is signed with a throwaway key and will not install over older builds."
          fi

      # APP_VERSION is what the app shows on Settings and compares for updates.
      - name: Build APK
        env:
          FCU_KEYSTORE_PASSWORD: ${{ secrets.FCU_KEYSTORE_PASSWORD }}
          FCU_KEY_ALIAS: ${{ secrets.FCU_KEY_ALIAS }}
          FCU_KEY_PASSWORD: ${{ secrets.FCU_KEY_PASSWORD }}
        run: >-
          flutter build apk --debug
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.version_code }}
          --dart-define=APP_VERSION=${{ needs.version.outputs.version }}
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} ${{ env.FCM_DEFINES }}

      - name: Name the file
        run: cp build/app/outputs/flutter-apk/app-debug.apk fcu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/fcu.apk
          retention-days: 14
          if-no-files-found: error

  ios:
    needs: version
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: >-
          flutter build ios --release --no-codesign
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.version_code }}
          --dart-define=APP_VERSION=${{ needs.version.outputs.version }}
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} ${{ env.FCM_DEFINES }}

      - name: Package the .ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "fcu-${{ needs.version.outputs.version }}-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: mobile/fcu-${{ needs.version.outputs.version }}-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

  # One release for the version, with both files. Runs only when both builds succeeded.
  release:
    needs: [version, android, ios]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Both files are here
        run: |
          ls -l dist
          test -s dist/fcu.apk
          test -s "dist/fcu-${{ needs.version.outputs.version }}-unsigned.ipa"

      - name: Release text and checksums
        run: |
          cp "${{ needs.version.outputs.notes }}" RELEASE.md
          {
            echo
            echo "## SHA-256"
            echo
            echo '```'
            (cd dist && sha256sum *)
            echo '```'
          } >> RELEASE.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.version.outputs.tag }}"
          title="FCU app ${{ needs.version.outputs.version }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # A release for this version already exists without the files (e.g. made by hand): fill it.
            gh release upload "$tag" dist/* --clobber --repo "${{ github.repository }}"
            gh release edit "$tag" --repo "${{ github.repository }}" --title "$title" \
              --notes-file RELEASE.md --prerelease=false --draft=false --latest
          else
            gh release create "$tag" dist/* --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" --title "$title" --notes-file RELEASE.md --latest
          fi
          gh release view "$tag" --repo "${{ github.repository }}" --json url,assets --jq '.url, .assets[].name'
