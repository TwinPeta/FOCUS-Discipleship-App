# Builds the FCU app for testers and publishes it as a GitHub pre-release:
#   - an Android APK (release build, signed with the debug key: installable, not for the Play Store)
#   - an UNSIGNED iOS .ipa (Apple needs signing to install; testers sideload it with AltStore or Sideloadly,
#     until a TestFlight pipeline with an Apple Developer account is added)
#
# Start it by pushing a tag, e.g.
#     git tag mobile-v1.0.0-beta.1 && git push origin mobile-v1.0.0-beta.1
# or from Actions > "Mobile release" > Run workflow (give the version, e.g. 1.0.0-beta.1).
# The release text is mobile/docs/release-notes/<version>.md.
#
# Repository variable API_BASE_URL (Settings > Secrets and variables > Actions > Variables) sets the server the
# build talks to. Default: https://apis.focusuganda.org/v1
name: Mobile release

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.0.0-beta.1 (needs mobile/docs/release-notes/<version>.md)'
        required: true

permissions:
  contents: write

env:
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://apis.focusuganda.org/v1' }}
  FLUTTER_VERSION: 3.50.0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION:-${GITHUB_REF_NAME#mobile-v}}"
          if ! [[ "$v" =~ ^[0-9A-Za-z.+-]+$ ]]; then echo "Bad version: $v"; exit 1; fi
          if [ ! -f "mobile/docs/release-notes/$v.md" ]; then echo "Missing mobile/docs/release-notes/$v.md"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      # Golden images are rendered on Windows; fonts differ on Linux, so goldens only run locally.
      - name: Test (all but goldens)
        run: |
          dirs=$(find test -mindepth 1 -maxdepth 1 -type d ! -name golden ! -name support | sort)
          flutter test $dirs test/widget_test.dart
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - name: Name the file
        run: cp build/app/outputs/flutter-apk/app-release.apk "fcu-${{ needs.version.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/fcu-${{ needs.version.outputs.version }}.apk
          if-no-files-found: error

  ios:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - name: Package the .ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "fcu-${{ needs.version.outputs.version }}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: mobile/fcu-${{ needs.version.outputs.version }}-unsigned.ipa
          if-no-files-found: error

  release:
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release text and checksums
        run: |
          v="${{ needs.version.outputs.version }}"
          cp "mobile/docs/release-notes/$v.md" RELEASE.md
          {
            echo
            echo "## SHA-256"
            echo
            echo '```'
            (cd dist && sha256sum *)
            echo '```'
          } >> RELEASE.md
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FCU app ${{ needs.version.outputs.version }} (testers)
          body_path: RELEASE.md
          prerelease: true
          files: dist/*
