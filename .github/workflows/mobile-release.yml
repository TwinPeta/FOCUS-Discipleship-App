# Builds the FCU app for testers and publishes it as a GitHub pre-release:
#   - an Android APK (release build, signed with the debug key: installable, not for the Play Store)
#   - an UNSIGNED iOS .ipa (Apple needs signing to install; testers sideload it with AltStore or Sideloadly,
#     until a TestFlight pipeline with an Apple Developer account is added)
#
# The version is `version:` in mobile/pubspec.yaml (never a build number), and
# mobile/docs/release-notes/<version>.md must exist or nothing is built (.github/scripts/mobile-version.sh).
# Start it from Actions > "Mobile release" > Run workflow, or by pushing the matching tag, e.g.
#     git tag mobile-v1.0.0-beta.2 && git push origin mobile-v1.0.0-beta.2
# (a tag that does not match pubspec.yaml is refused). The release is the same one "Mobile build" publishes
# (tag mobile-v<version>, text = the release notes); this adds the release APK and the iOS file to it.
#
# Repository variable API_BASE_URL (Settings > Secrets and variables > Actions > Variables) sets the server the
# build talks to. Default: https://apis.focusuganda.org/v1
name: Mobile release

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://apis.focusuganda.org/v1' }}
  # Public Firebase identifiers for phone push (repository variables); empty = local notifications only.
  FCM_DEFINES: >-
    --dart-define=FCM_PROJECT_ID=${{ vars.FCM_PROJECT_ID }}
    --dart-define=FCM_SENDER_ID=${{ vars.FCM_SENDER_ID }}
    --dart-define=FCM_API_KEY_ANDROID=${{ vars.FCM_API_KEY_ANDROID }}
    --dart-define=FCM_APP_ID_ANDROID=${{ vars.FCM_APP_ID_ANDROID }}
    --dart-define=FCM_API_KEY_IOS=${{ vars.FCM_API_KEY_IOS }}
    --dart-define=FCM_APP_ID_IOS=${{ vars.FCM_APP_ID_IOS }}
    --dart-define=FCM_IOS_BUNDLE_ID=${{ vars.FCM_IOS_BUNDLE_ID }}
  FLUTTER_VERSION: 3.50.0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the Android version code is the commit count
      # Version from pubspec.yaml and its release notes, before anything is built.
      - id: v
        run: bash .github/scripts/mobile-version.sh
      - name: Tag matches the version
        if: github.event_name == 'push'
        run: |
          if [ "$GITHUB_REF_NAME" != "${{ steps.v.outputs.tag }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mobile/pubspec.yaml (${{ steps.v.outputs.tag }})."
            exit 1
          fi

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      # Golden images are rendered on Windows; fonts differ on Linux, so goldens only run locally.
      - name: Test (all but goldens)
        run: |
          dirs=$(find test -mindepth 1 -maxdepth 1 -type d ! -name golden ! -name support | sort)
          flutter test $dirs test/widget_test.dart
      - name: Build release APK
        run: >-
          flutter build apk --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.version_code }}
          --dart-define=APP_VERSION=${{ needs.version.outputs.version }}
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} ${{ env.FCM_DEFINES }}
      - name: Name the file
        run: cp build/app/outputs/flutter-apk/app-release.apk "fcu-${{ needs.version.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/fcu-${{ needs.version.outputs.version }}.apk
          if-no-files-found: error

  ios:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build iOS (unsigned)
        run: >-
          flutter build ios --release --no-codesign
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.version_code }}
          --dart-define=APP_VERSION=${{ needs.version.outputs.version }}
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} ${{ env.FCM_DEFINES }}
      - name: Package the .ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "fcu-${{ needs.version.outputs.version }}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: mobile/fcu-${{ needs.version.outputs.version }}-unsigned.ipa
          if-no-files-found: error

  release:
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release text and checksums
        run: |
          v="${{ needs.version.outputs.version }}"
          cp "mobile/docs/release-notes/$v.md" RELEASE.md
          {
            echo
            echo "## SHA-256"
            echo
            echo '```'
            (cd dist && sha256sum *)
            echo '```'
          } >> RELEASE.md
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FCU app ${{ needs.version.outputs.version }}
          body_path: RELEASE.md
          # One release per version, shared with "Mobile build" (which adds fcu.apk, the file the app updates from).
          prerelease: false
          files: dist/*
